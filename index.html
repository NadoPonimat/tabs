<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tab Studio — табулатуры</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:#111418;color:#e8eaed;font:15px system-ui,sans-serif}
header{padding:8px;display:grid;gap:6px;background:#1a1e24;border-bottom:1px solid #2b313a}
.row{display:flex;gap:6px;flex-wrap:wrap}
input,select,button{font:inherit;color:inherit;background:#252b33;border:1px solid #3a424d;border-radius:8px;padding:8px 10px}
input{flex:1;min-width:0}
button{cursor:pointer}
button:active{background:#323a45}
.seg button.on{background:#3b82f6;border-color:#3b82f6;color:#fff}
main{flex:1;overflow:auto;padding:8px;display:flex;justify-content:center;align-items:flex-start}
#sheet{width:100%;max-width:760px}
#sheet svg{width:100%;height:auto;display:block;border-radius:6px}
#pad{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;padding:8px;background:#1a1e24;border-top:1px solid #2b313a}
#pad button{padding:12px 0;font-size:17px;text-align:center}
dialog{background:#1a1e24;color:inherit;border:1px solid #3a424d;border-radius:12px;width:calc(100% - 24px);max-width:420px}
label{display:grid;gap:4px;margin:8px 0;font-size:13px}
.hint{font-size:12px;opacity:.7;line-height:1.4}
#ghS{margin-top:10px;display:grid;gap:6px;word-break:break-all;font-size:13px}
</style>
</head>
<body>
<header>
  <div class="row"><input id="ti" placeholder="Название"><input id="ar" placeholder="Исполнитель"></div>
  <div class="row seg">
    <button data-i="guitar">Гитара</button><button data-i="ukulele">Укулеле</button>
    <select id="th"></select><select id="cp"></select>
  </div>
  <div class="row"><button id="bp">Скачать PNG</button><button id="bf">Скачать PDF</button><button id="bg">GitHub</button></div>
</header>
<main><div id="sheet"></div></main>
<div id="pad"></div>

<dialog id="dlg">
  <h3 style="margin:0 0 4px">Выгрузка на GitHub</h3>
  <label>Токен<input id="ghT" type="password" autocomplete="off"></label>
  <label>Репозиторий<input id="ghR" placeholder="логин/репозиторий"></label>
  <label>Папка<input id="ghD" placeholder="tabs"></label>
  <p class="hint">Токен: GitHub → Settings → Developer settings → Fine-grained tokens, доступ Contents: Read and write только к этому репозиторию. В репозитории включи Pages (ветка main). Токен хранится только в этом браузере.</p>
  <div class="row"><button id="ghP">Выгрузить</button><button id="ghL">Мои табы</button><button id="ghX">Закрыть</button></div>
  <div id="ghS"></div>
</dialog>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TUN={guitar:['e','B','G','D','A','E'],ukulele:['A','E','C','G']};
const TH={
  paper:{n:'Бумага',bg:'#ffffff',ink:'#111111',ln:'#555555',ac:'#1d4ed8',f:'Georgia,serif'},
  blue:{n:'Чертёж',bg:'#12305a',ink:'#e8f1ff',ln:'#7fa6d8',ac:'#ffd166',f:'Consolas,Menlo,monospace'},
  stage:{n:'Сцена',bg:'#16110d',ink:'#f4e6cf',ln:'#8a6d52',ac:'#ff8a1f',f:'Impact,Arial Narrow,sans-serif'},
  chalk:{n:'Мел',bg:'#1f3a2e',ink:'#f2f2e8',ln:'#86a595',ac:'#f6e27a',f:'Bradley Hand,Segoe Print,Comic Sans MS,cursive'},
  neon:{n:'Неон',bg:'#0b0b14',ink:'#e6f7ff',ln:'#4a4a7a',ac:'#ff2e93',f:'Trebuchet MS,Verdana,sans-serif'}
};
const RU='абвгдеёжзийклмнопрстуфхцчшщъыьэюя';
const EN=['a','b','v','g','d','e','e','zh','z','i','y','k','l','m','n','o','p','r','s','t','u','f','h','ts','ch','sh','sch','','y','','e','yu','ya'];
const nc=()=>({c:Array(TUN[d.inst].length).fill(''),b:false});
function fresh(){const c=[];for(let i=0;i<16;i++)c.push({c:Array(6).fill(''),b:i%4==3});return{title:'',artist:'',inst:'guitar',theme:'paper',cpl:8,cols:c}}
let d;try{d=Object.assign(fresh(),JSON.parse(localStorage.tab))}catch(e){d=fresh()}
let sel={r:0,c:0},lastT=0;

/* ---------- отрисовка ---------- */
function render(d,edit){
  const t=TH[d.theme],T=TUN[d.inst],n=T.length,G=22,CW=34,LM=46,cpl=d.cpl,N=d.cols.length;
  const L=Math.ceil(N/cpl),BH=(n-1)*G+46,H0=88,W=LM+cpl*CW+18,H=H0+L*BH+8;
  const ln=(x1,y1,x2,y2,c,w)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}"/>`;
  let s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" font-family="${t.f}"><rect width="${W}" height="${H}" fill="${t.bg}"/>`;
  s+=`<text x="18" y="42" font-size="26" font-weight="700" fill="${t.ink}">${esc(d.title||'Без названия')}</text>`;
  s+=`<text x="18" y="64" font-size="14" fill="${t.ink}" fill-opacity=".7">${esc(d.artist)}</text>`;
  s+=`<text x="${W-18}" y="42" font-size="13" text-anchor="end" fill="${t.ac}" font-weight="700">${d.inst=='guitar'?'Гитара':'Укулеле'}</text>`;
  for(let l=0;l<L;l++){
    const y0=H0+l*BH+14,cnt=Math.min(cpl,N-l*cpl),x1=LM+cnt*CW,yb=y0+(n-1)*G;
    for(let r=0;r<n;r++){
      const y=y0+r*G;
      s+=ln(LM,y,x1,y,t.ln,1);
      s+=`<text x="${LM-10}" y="${y+4}" font-size="12" text-anchor="end" fill="${t.ac}" font-weight="700">${T[r]}</text>`;
    }
    s+=ln(LM,y0,LM,yb,t.ink,1.6);
    for(let p=0;p<cnt;p++){
      const i=l*cpl+p,col=d.cols[i],cx=LM+p*CW+CW/2;
      if(col.b||p==cnt-1)s+=ln(LM+(p+1)*CW,y0,LM+(p+1)*CW,yb,t.ink,1.6);
      for(let r=0;r<n;r++){
        const v=col.c[r]||'',y=y0+r*G;
        if(edit&&sel.c==i&&sel.r==r)s+=`<rect class="sel" x="${cx-16}" y="${y-11}" width="32" height="22" rx="5" fill="${t.ac}" fill-opacity=".28" stroke="${t.ac}"/>`;
        if(v!==''){
          const w=v.length*9+4;
          s+=`<rect x="${cx-w/2}" y="${y-9}" width="${w}" height="18" fill="${t.bg}"/>`;
          s+=`<text x="${cx}" y="${y+5}" font-size="15" font-weight="700" text-anchor="middle" fill="${t.ink}">${esc(v)}</text>`;
        }
        if(edit)s+=`<rect data-r="${r}" data-c="${i}" x="${cx-17}" y="${y-11}" width="34" height="22" fill="transparent" stroke="${t.ln}" stroke-opacity=".15"/>`;
      }
    }
  }
  return s+'</svg>';
}
function draw(sc){
  $('#sheet').innerHTML=render(d,true);
  if(sc){const e=$('#sheet .sel');if(e)e.scrollIntoView({block:'nearest',inline:'nearest'})}
  document.querySelectorAll('[data-i]').forEach(b=>b.classList.toggle('on',b.dataset.i==d.inst));
  try{localStorage.tab=JSON.stringify(d)}catch(e){}
}
function sync(){$('#ti').value=d.title;$('#ar').value=d.artist;$('#th').value=d.theme;$('#cp').value=d.cpl}
function loadData(x){d=Object.assign(fresh(),x);sel={r:0,c:0};sync();draw()}

/* ---------- ввод ---------- */
function key(k){
  const cell=d.cols[sel.c].c;let v=cell[sel.r]||'';const now=Date.now();
  if(/^\d$/.test(k)){v=(now-lastT<1400&&/^\d$/.test(v)&&v!=='0'&&+(v+k)<=24)?v+k:k;lastT=now}
  else if(k==='x')v='x';
  else if(k==='del')v=v.slice(0,-1);
  else if(/\d$/.test(v))v+=k;
  cell[sel.r]=v;draw(1);
}
function mv(dr,dc){
  const n=TUN[d.inst].length;sel.r=Math.max(0,Math.min(n-1,sel.r+dr));
  if(dc>0&&sel.c==d.cols.length-1)d.cols.push(nc());
  sel.c=Math.max(0,Math.min(d.cols.length-1,sel.c+dc));lastT=0;draw(1);
}
const addC=()=>{d.cols.splice(sel.c+1,0,nc());sel.c++;draw(1)};
const bar=()=>{d.cols[sel.c].b=!d.cols[sel.c].b;draw(1)};
const delC=()=>{if(d.cols.length>1){d.cols.splice(sel.c,1);sel.c=Math.min(sel.c,d.cols.length-1);draw(1)}};
const ACT={'←':()=>mv(0,-1),'↑':()=>mv(-1,0),'↓':()=>mv(1,0),'→':()=>mv(0,1),'⌫':()=>key('del'),'+':addC,'|':bar,'✕':delC};
const TIPS={'+':'Добавить колонку','|':'Тактовая черта','✕':'Удалить колонку','⌫':'Стереть'};
['1','2','3','4','5','6','7','8','9','0','x','h','p','/','\\','~','←','↑','↓','→','⌫','+','|','✕'].forEach(k=>{
  const b=document.createElement('button');b.textContent=k;if(TIPS[k])b.title=TIPS[k];
  b.onclick=()=>(ACT[k]||(()=>key(k)))();$('#pad').append(b);
});
document.addEventListener('keydown',e=>{
  if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;
  const m={ArrowLeft:'←',ArrowRight:'→',ArrowUp:'↑',ArrowDown:'↓',Backspace:'⌫'}[e.key];
  if(m){e.preventDefault();ACT[m]()}else if(/^[0-9xhp~\/\\]$/.test(e.key))key(e.key);
});
$('#sheet').addEventListener('click',e=>{
  const r=e.target.closest('[data-r]');if(r){sel={r:+r.dataset.r,c:+r.dataset.c};lastT=0;draw()}
});

/* ---------- настройки ---------- */
$('#ti').oninput=e=>{d.title=e.target.value;draw()};
$('#ar').oninput=e=>{d.artist=e.target.value;draw()};
for(const k in TH)$('#th').add(new Option(TH[k].n,k));
[8,12,16].forEach(n=>$('#cp').add(new Option(n+' колонок в строке',n)));
$('#th').onchange=e=>{d.theme=e.target.value;draw()};
$('#cp').onchange=e=>{d.cpl=+e.target.value;draw()};
document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{
  d.inst=b.dataset.i;const n=TUN[d.inst].length;
  d.cols.forEach(c=>{c.c=c.c.slice(0,n);while(c.c.length<n)c.c.push('')});
  sel.r=Math.min(sel.r,n-1);draw();
});

/* ---------- экспорт ---------- */
const base=()=>(d.title.toLowerCase().split('').map(c=>{const i=RU.indexOf(c);return i<0?c:EN[i]}).join('').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'tab');
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
function toCanvas(){
  return new Promise((res,rej)=>{
    const s=render(d,false),m=s.match(/viewBox="0 0 (\d+) (\d+)"/),w=+m[1],h=+m[2],im=new Image();
    im.onload=()=>{const c=document.createElement('canvas');c.width=w*2;c.height=h*2;const g=c.getContext('2d');g.scale(2,2);g.drawImage(im,0,0,w,h);res(c)};
    im.onerror=rej;im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);
  });
}
$('#bp').onclick=async()=>{const c=await toCanvas();c.toBlob(b=>dl(b,base()+'.png'),'image/png')};
$('#bf').onclick=async()=>{
  const cv=await toCanvas(),W=595,H=842,M=24,sc=(W-2*M)/cv.width,ph=Math.floor((H-2*M)/sc),pages=[];
  for(let y=0;y<cv.height;y+=ph){
    const h=Math.min(ph,cv.height-y),t=document.createElement('canvas');t.width=cv.width;t.height=h;
    t.getContext('2d').drawImage(cv,0,y,cv.width,h,0,0,cv.width,h);
    pages.push({bin:atob(t.toDataURL('image/jpeg',.92).split(',')[1]),w:cv.width,h});
  }
  const bg=TH[d.theme].bg,rgb=[1,3,5].map(i=>(parseInt(bg.substr(i,2),16)/255).toFixed(3)).join(' ');
  let out='%PDF-1.4\n',offs=[];const add=s=>{offs.push(out.length);out+=s};
  add('1 0 obj<</Type/Catalog/Pages 2 0 R>>endobj\n');
  add(`2 0 obj<</Type/Pages/Count ${pages.length}/Kids[${pages.map((_,i)=>(3+3*i)+' 0 R').join(' ')}]>>endobj\n`);
  pages.forEach((p,i)=>{
    const o=3+3*i,cs=`${rgb} rg 0 0 ${W} ${H} re f q ${(p.w*sc).toFixed(2)} 0 0 ${(p.h*sc).toFixed(2)} ${M} ${(H-M-p.h*sc).toFixed(2)} cm /I Do Q`;
    add(`${o} 0 obj<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${W} ${H}]/Resources<</XObject<</I ${o+2} 0 R>>>>/Contents ${o+1} 0 R>>endobj\n`);
    add(`${o+1} 0 obj<</Length ${cs.length}>>stream\n${cs}\nendstream endobj\n`);
    add(`${o+2} 0 obj<</Type/XObject/Subtype/Image/Width ${p.w}/Height ${p.h}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${p.bin.length}>>stream\n${p.bin}\nendstream endobj\n`);
  });
  const xr=out.length;
  out+=`xref\n0 ${offs.length+1}\n0000000000 65535 f \n`+offs.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')+`trailer<</Size ${offs.length+1}/Root 1 0 R>>\nstartxref\n${xr}\n%%EOF`;
  dl(new Blob([Uint8Array.from(out,c=>c.charCodeAt(0))],{type:'application/pdf'}),base()+'.pdf');
};

/* ---------- GitHub ---------- */
const b64=s=>btoa(unescape(encodeURIComponent(s)));
const st=h=>{$('#ghS').innerHTML=h};
function cfg(){
  const c={t:$('#ghT').value.trim(),r:$('#ghR').value.trim(),f:$('#ghD').value.trim().replace(/^\/|\/$/g,'')||'tabs'};
  try{localStorage.gh=JSON.stringify(c)}catch(e){}return c;
}
const hd=c=>({Authorization:'Bearer '+c.t,Accept:'application/vnd.github+json'});
async function put(path,content,c){
  const u=`https://api.github.com/repos/${c.r}/contents/${path}`;let sha;
  const g=await fetch(u,{headers:hd(c),cache:'no-store'});if(g.ok)sha=(await g.json()).sha;
  const r=await fetch(u,{method:'PUT',headers:hd(c),body:JSON.stringify({message:'tab: '+(d.title||'без названия'),content:b64(content),sha})});
  if(!r.ok)throw new Error((await r.json()).message||r.status);
}
function page(){
  const t=TH[d.theme],s=render(d,false).replace(/width="\d+" height="\d+"/,'style="width:100%;height:auto;display:block"');
  return `<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(d.title||'Табулатура')}</title><body style="margin:0;background:${t.bg};display:flex;justify-content:center"><div style="width:100%;max-width:900px">${s}</div></body></html>`;
}
$('#bg').onclick=()=>{
  try{const c=JSON.parse(localStorage.gh);$('#ghT').value=c.t||'';$('#ghR').value=c.r||'';$('#ghD').value=c.f||''}catch(e){}
  st('');$('#dlg').showModal();
};
$('#ghX').onclick=()=>$('#dlg').close();
$('#ghP').onclick=async()=>{
  const c=cfg();
  if(!c.t||!/^[^/]+\/[^/]+$/.test(c.r)){st('Укажи токен и репозиторий в формате логин/репозиторий');return}
  st('Выгружаю…');
  try{
    d.slug=d.slug||base()+'-'+Date.now().toString(36).slice(-4);
    await put(`${c.f}/${d.slug}.json`,JSON.stringify(d),c);
    await put(`${c.f}/${d.slug}.html`,page(),c);
    draw();
    const [o,rp]=c.r.split('/'),host=rp.toLowerCase()==o.toLowerCase()+'.github.io'?`https://${rp}`:`https://${o}.github.io/${rp}`;
    const u=`${host}/${c.f}/${d.slug}.html`;
    st(`Готово. Ссылка (заработает через минуту после включения Pages):<br><a href="${esc(u)}" target="_blank" style="color:#7db4ff">${esc(u)}</a>`);
    const b=document.createElement('button');b.textContent='Скопировать ссылку';
    b.onclick=()=>navigator.clipboard.writeText(u).then(()=>b.textContent='Скопировано');$('#ghS').append(b);
  }catch(e){st('Ошибка: '+esc(e.message))}
};
$('#ghL').onclick=async()=>{
  const c=cfg();st('Загружаю список…');
  try{
    const r=await fetch(`https://api.github.com/repos/${c.r}/contents/${c.f}`,{headers:hd(c),cache:'no-store'}),a=await r.json();
    if(!r.ok)throw new Error(a.message);
    const box=$('#ghS');box.innerHTML='';
    a.filter(x=>x.name.endsWith('.json')).forEach(x=>{
      const b=document.createElement('button');b.textContent=x.name.replace('.json','');
      b.onclick=async()=>{loadData(await(await fetch(x.download_url)).json());$('#dlg').close()};box.append(b);
    });
    if(!box.children.length)box.textContent='Пока пусто';
  }catch(e){st('Ошибка: '+esc(e.message))}
};

sync();draw();
</script>
</body>
</html>
